name: Build MicroPython PDM Firmware

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.2.2

    steps:
      - name: Checkout custom code
        uses: actions/checkout@v4
        with:
          path: custom_code

      - name: Checkout MicroPython v1.23.0
        uses: actions/checkout@v4
        with:
          repository: micropython/micropython
          ref: v1.23.0
          path: micropython
          submodules: false

      - name: Build mpy-cross
        run: |
          cd micropython
          git submodule update --init lib/micropython-lib
          make -C mpy-cross -j$(nproc)

      - name: Prepare ESP32 submodules
        run: |
          cd micropython
          git submodule update --init lib/berkeley-db-1.xx lib/tinyusb
          cd ports/esp32
          make submodules

      - name: Build ESP32-S3 Firmware (two-pass for TinyUSB fix)
        run: |
          . /opt/esp/idf/export.sh
          MODULE_PATH="$(pwd)/custom_code/dispositivo/firmware_personalizado/modulo_pdm/micropython.cmake"
          cd micropython/ports/esp32

          # Primera pasada: descarga managed_components y falla en TinyUSB
          make BOARD=ESP32_GENERIC_S3 BOARD_VARIANT=SPIRAM_OCT USER_C_MODULES="$MODULE_PATH" || true

          # Parchar el archivo problemático con el buffer correcto de USB Full-Speed (64 bytes)
          sed -i '1i #ifndef CFG_TUD_CDC_EP_BUFSIZE\n#define CFG_TUD_CDC_EP_BUFSIZE 64\n#endif' \
            managed_components/espressif__esp_tinyusb/usb_descriptors.c

          # Eliminar el hash para que ESP-IDF acepte la modificación
          rm -f managed_components/espressif__esp_tinyusb/.component_hash

          # Segunda pasada: compila correctamente con el parche
          make -j$(nproc) BOARD=ESP32_GENERIC_S3 BOARD_VARIANT=SPIRAM_OCT USER_C_MODULES="$MODULE_PATH"

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32-s3-pdm
          path: |
            micropython/ports/esp32/build-ESP32_GENERIC_S3-SPIRAM_OCT/firmware.bin
            micropython/ports/esp32/build-ESP32_GENERIC_S3-SPIRAM_OCT/bootloader/bootloader.bin
            micropython/ports/esp32/build-ESP32_GENERIC_S3-SPIRAM_OCT/partition_table/partition-table.bin
