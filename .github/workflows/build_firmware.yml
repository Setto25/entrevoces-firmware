name: Build MicroPython PDM Firmware

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.2.2

    steps:
      - name: Checkout custom code
        uses: actions/checkout@v4
        with:
          path: custom_code

      - name: Checkout MicroPython v1.23.0
        uses: actions/checkout@v4
        with:
          repository: micropython/micropython
          ref: v1.23.0
          path: micropython
          submodules: recursive

      - name: Build mpy-cross
        run: |
          make -C micropython/mpy-cross -j$(nproc)

      - name: Build ESP32-S3 Firmware
        run: |
          . /opt/esp/idf/export.sh
          MODULE_PATH="$(pwd)/custom_code/dispositivo/firmware_personalizado/modulo_pdm/micropython.cmake"
          cd micropython/ports/esp32
          make submodules
          make -j$(nproc) BOARD=ESP32_GENERIC_S3 USER_C_MODULES="$MODULE_PATH" CFLAGS_EXTRA="-DCFG_TUD_CDC_EP_BUFSIZE=512"

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32-s3-pdm
          path: |
            micropython/ports/esp32/build-ESP32_GENERIC_S3/firmware.bin
            micropython/ports/esp32/build-ESP32_GENERIC_S3/bootloader/bootloader.bin
            micropython/ports/esp32/build-ESP32_GENERIC_S3/partition_table/partition-table.bin
