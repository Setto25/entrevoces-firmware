[project]
name = "entrevoces-servidor"
version = "0.1.0"
description = "Backend del MVP de EntreVoces"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.116,<1.0",
    "python-multipart>=0.0.20,<1.0",
    "uvicorn>=0.35,<1.0",
]

[dependency-groups]
desarrollo = [
    "httpx>=0.28,<1.0",
    "pytest>=8.4,<10.0",
]

[tool.pytest.ini_options]
testpaths = ["pruebas"]
python_files = ["prueba_*.py"]
pythonpath = ["."]
addopts = "-q"
